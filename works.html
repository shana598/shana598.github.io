<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>My Works</title>
<link rel="stylesheet" href="works.css">


</head>

<body>

<header>
    <a href="index.html#project" class="back-btn" aria-label="Back to portfolio">←</a>
    <h1>My Works</h1>
</header>

<div class="main-container">

    <!-- 🔥 GRID -->
    <div class="container" id="grid">

        <div class="card" data-img="img/SCAPPA.svg" tabindex="0" role="button" aria-label="View Scappa project">
            <img src="img/mockup1.svg">
            <div class="overlay">
                <h3>Scappa</h3>
                <p>Fintech Website Design</p>
            </div>
        </div>

        <div class="card" data-img="img/DONEZO.svg" tabindex="0" role="button" aria-label="View Donezo project">
            <img src="img/mockup2.svg">
            <div class="overlay">
                <h3>Donezo</h3>
                <p>Project Management Dashboard</p>
            </div>
        </div>

        <div class="card" data-img="img/INVESTMENT.svg" tabindex="0" role="button" aria-label="View investment platform project">
            <img src="img/mockup3.svg">
            <div class="overlay">
                <h3>Investment Platform</h3>
                <p>Fintech Web Design</p>
            </div>
        </div>

        <div class="card" data-img="img/TASTEORY.svg" tabindex="0" role="button" aria-label="View Tasteory project">
            <img src="img/mockup4.svg">
            <div class="overlay">
                <h3>Tasteory</h3>
                <p>Restaurant Website Design</p>
            </div>
        </div>

        <div class="card" data-img="img/MONDLY.svg" tabindex="0" role="button" aria-label="View Mondly project">
            <img src="img/mockup5.svg">
            <div class="overlay">
                <h3>Mondly</h3>
                <p>EdTech Dashboard Design</p>
            </div>
        </div>

        <div class="card" data-img="img/mockup7.png" tabindex="0" role="button" aria-label="View College Finder project">
            <img src="img/mockup7.png">
            <div class="overlay">
                <h3>College Finder</h3>
                <p>Education Mobile App Design</p>
            </div>
        </div>

        <div class="card" data-img="img/FOOD APP.svg" tabindex="0" role="button" aria-label="View Food App project">
            <img src="img/Foo App mockup.png" alt="Food app project mockup">
            <div class="overlay">
                <h3>Food App</h3>
                <p>Mobile App Design</p>
            </div>
        </div>

    </div>

    <!-- 🔥 PREVIEW -->
    <div class="preview" id="preview">
        <div class="preview-nav">
            <h4>Project Detail</h4>
            <button id="backBtn" aria-label="Back to Portfolio">←</button>
        </div>
        
        <img id="previewImg">
    </div>

</div>

<script>
const cards = document.querySelectorAll(".card");
const grid = document.getElementById("grid");
const preview = document.getElementById("preview");
const previewImg = document.getElementById("previewImg");
const backBtn = document.getElementById("backBtn");

cards.forEach(card => {
    const openPreview = () => {
        const imgSrc = card.getAttribute("data-img");

        grid.style.display = "none";
        preview.style.display = "block";
        previewImg.src = imgSrc;
    };

    card.addEventListener("click", openPreview);
    card.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            openPreview();
        }
    });
});

backBtn.addEventListener("click", () => {
    preview.style.display = "none";
    grid.style.display = "grid";
});
</script>

</body>
</html>
