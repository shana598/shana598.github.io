<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Works</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    header {
      background: #111;
      color: white;
      padding: 20px;
      text-align: center;
      position: relative;
    }

    .back-btn {
      position: absolute;
      left: 20px;
      top: 20px;
      background: white;
      color: black;
      padding: 8px 12px;
      border-radius: 5px;
      text-decoration: none;
    }

    /* Grid */
    .container {
      padding: 40px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 25px;
    }

    /* Card */
    .card {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 6px 15px rgba(0,0,0,0.2);
    }

    .card img {
      width: 100%;
      height: 250px;
      object-fit: cover;
      display: block;
    }

    /* Overlay */
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.75);
      color: white;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      text-align: center;
      opacity: 0;
      transition: 0.4s ease;
      padding: 20px;
    }

    .card:hover .overlay {
      opacity: 1;
    }

    .overlay h3 {
      margin-bottom: 10px;
    }

    .overlay p {
      font-size: 14px;
      margin-bottom: 15px;
    }

    .btn {
      padding: 8px 14px;
      background: white;
      color: black;
      text-decoration: none;
      border-radius: 5px;
      font-weight: bold;
    }

    .btn:hover {
      background: #ddd;
    }

    /* Mobile */
    @media (max-width: 768px) {
      .container {
        grid-template-columns: 1fr;
      }
    }

  </style>
</head>

<body>

<header>
  <a href="index.html" class="back-btn">⬅ Back</a>
  <h1>My Works</h1>
</header>

<div class="container">

  <!-- 1 -->
  <div class="card">
    <img src="https://picsum.photos/500/350?1">
    <div class="overlay">
      <h3>Project 1</h3>
      <p>Website Design</p>
      <a href="#" class="btn">View</a>
    </div>
  </div>

  <!-- 2 -->
  <div class="card">
    <img src="https://picsum.photos/500/350?2">
    <div class="overlay">
      <h3>Project 2</h3>
      <p>Mobile App UI</p>
      <a href="#" class="btn">View</a>
    </div>
  </div>

  <!-- 3 -->
  <div class="card">
    <img src="https://picsum.photos/500/350?3">
    <div class="overlay">
      <h3>Project 3</h3>
      <p>Dashboard UI</p>
      <a href="#" class="btn">View</a>
    </div>
  </div>

  <!-- 4 -->
  <div class="card">
    <img src="https://picsum.photos/500/350?4">
    <div class="overlay">
      <h3>Project 4</h3>
      <p>E-commerce Design</p>
      <a href="#" class="btn">View</a>
    </div>
  </div>

  <!-- 5 -->
  <div class="card">
    <img src="https://picsum.photos/500/350?5">
    <div class="overlay">
      <h3>Project 5</h3>
      <p>Landing Page</p>
      <a href="#" class="btn">View</a>
    </div>

  <!-- 6 -->

      <h3>Project 6</h3>

      <a href="#" class="btn">View</a>
    </div>
  </div>

</div>

</body>
</html>
