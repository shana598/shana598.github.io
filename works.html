<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>My Works</title>
<link rel="stylesheet" href="works.css">


</head>

<body>

<header>
    <a href="index.html" class="back-btn">⬅ Back</a>
    <h1>My Works</h1>
</header>

<div class="main-container">

    <!-- 🔥 GRID -->
    <div class="container" id="grid">

        <div class="card">
            <img src="img/mockup1.svg">
            <div class="overlay">
                <h3>Project 1</h3>
                <p>Website Design</p>
                <a href="#" class="btn" data-img="img/pic-3.svg">View</a>
            </div>
        </div>

        <div class="card">
            <img src="img/mockup2.svg">
            <div class="overlay">
                <h3>Project 2</h3>
                <p>Mobile App UI</p>
                <a href="#" class="btn" data-img="img/Desktop - 3.svg">View</a>
            </div>
        </div>

        <div class="card">
            <img src="img/mockup3.svg">
            <div class="overlay">
                <h3>Project 3</h3>
                <p>Dashboard UI</p>
                <a href="#" class="btn" data-img="img/Desktop-4.svg">View</a>
            </div>
        </div>

        <div class="card">
            <img src="img/mockup4.svg">
            <div class="overlay">
                <h3>Project 4</h3>
                <p>E-commerce Design</p>
                <a href="#" class="btn" data-img="img/Desktop-5.svg">View</a>
            </div>
        </div>

        <div class="card">
            <img src="img/mockup5.svg">
            <div class="overlay">
                <h3>Project 5</h3>
                <p>Landing Page</p>
                <a href="#" class="btn" data-img="img/Desktop -1.svg.svg">View</a>
            </div>
        </div>

        <div class="card">
            <img src="img/mockup7.png">
            <div class="overlay">
                <h3>Project 6</h3>
                <p>Portfolio UI</p>
                <a href="#" class="btn" data-img="img/mockup7.png">View</a>
            </div>
        </div>

    </div>

    <!-- 🔥 PREVIEW -->
    <div class="preview" id="preview">
        <div class="pre-button"><button id="backBtn">⬅ Back to works</button></div>
        
        <img id="previewImg">
    </div>

</div>

<script>
const buttons = document.querySelectorAll(".btn");
const grid = document.getElementById("grid");
const preview = document.getElementById("preview");
const previewImg = document.getElementById("previewImg");
const backBtn = document.getElementById("backBtn");

buttons.forEach(btn => {
    btn.addEventListener("click", (e) => {
        e.preventDefault();

        const imgSrc = btn.getAttribute("data-img");

        grid.style.display = "none";
        preview.style.display = "block";
        previewImg.src = imgSrc;
    });
});

backBtn.addEventListener("click", () => {
    preview.style.display = "none";
    grid.style.display = "grid";
});
</script>

</body>
</html>
